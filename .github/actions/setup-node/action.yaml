name: Set up Node.js
description: Install Node.js and dependencies

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
      with:
        cache: true
        cache-dependency-path: hack/js/pnpm-lock.yaml
        working-directory: hack/js
