name: Set up Go
description: Install Go and dependencies

inputs:
  go-version:
    description: Version of Go to install
    required: false

runs:
  using: composite
  steps:
    - name: Set up Go
      uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
      with:
        go-version: ${{ inputs.go-version }}
        go-version-file: ${{ inputs.go-version == '' && 'go.mod' || '' }}
        cache-dependency-path: go.sum
        check-latest: ${{ inputs.go-version != '' }}
